name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_*.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -project SuperIsland.xcodeproj \
            -scheme SuperIsland \
            -clonedSourcePackagesDirPath .build/packages \
            -resolvePackageDependencies

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SuperIsland.xcodeproj \
            -scheme SuperIsland \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/packages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project SuperIsland.xcodeproj \
            -scheme SuperIsland \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/packages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  lint:
    name: SwiftLint
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint (warnings only — does not fail the build)
        run: swiftlint lint --reporter github-actions-logging --quiet || true

      - name: Lint (strict — fails on errors)
        run: swiftlint lint --strict --reporter github-actions-logging SuperIsland ExtensionHost SuperIslandTests

name: NexusIsland
options:
  bundleIdPrefix: com.vexaltech
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  generateEmptyDirectories: true
  knownRegions:
    - en
    - ar
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
packages:
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: "0.3.0"
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "1.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.4.0"
targets:
  NexusIsland:
    type: application
    platform: macOS
    sources:
      - path: NexusIsland
        excludes:
          - "**/.DS_Store"
      - path: ExtensionHost
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    dependencies:
      - package: Aptabase
      - package: Pow
      - package: Lottie
    scheme:
      buildImplicitDependencies: true
      testTargets:
        - NexusIslandTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vexaltech.NexusIsland
        INFOPLIST_FILE: NexusIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: NexusIsland/NexusIsland.entitlements
        PRODUCT_NAME: NexusIsland
        INFOPLIST_KEY_CFBundleDisplayName: Nexus Island
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: NexusIsland/NexusIsland.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.reminders: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
    postCompileScripts:
      - name: "Copy Built-in Extensions"
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundledExtensions"
          mkdir -p "$DEST"

          # Pre-bundle WhatsApp provider with esbuild so node_modules aren't needed at runtime
          WA_PROVIDER="${SRCROOT}/Extensions/whatsapp-web/provider"
          if [ -d "${WA_PROVIDER}/node_modules" ]; then
            echo "Bundling WhatsApp provider with esbuild..."
            npx --yes esbuild \
              "${WA_PROVIDER}/index.mjs" \
              --bundle \
              --platform=node \
              --format=cjs \
              --outfile="${WA_PROVIDER}/bundle.cjs" 2>&1 && echo "esbuild: done" || echo "esbuild: failed (will use index.mjs)"
          fi

          for ext in ai-usage pomodoro whatsapp-web agents-status linear-mentions lastfm-scrobbler prayer-times; do
            SRC="${SRCROOT}/Extensions/${ext}"
            if [ -d "$SRC" ]; then
              rsync -a --delete \
                --exclude="node_modules/" \
                --exclude=".DS_Store" \
                --exclude="__pycache__/" \
                "${SRC}/" "${DEST}/${ext}/"
            fi
          done
  NexusIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NexusIslandTests
    dependencies:
      - target: NexusIsland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vexaltech.NexusIslandTests
        GENERATE_INFOPLIST_FILE: true

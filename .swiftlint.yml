# SwiftLint configuration for NexusIsland
#
# Tuned to match the existing codebase style:
#   - @MainActor on all UI-touching types
#   - guard-based early exits, no force unwrapping
#   - Manual Codable implementations (decodeIfPresent / encodeIfPresent)
#   - // MARK: - section comments
# This config keeps the linter from flooding pre-existing code with noise
# while still catching real regressions on new work.

included:
  - NexusIsland
  - ExtensionHost
  - NexusIslandTests

excluded:
  - NexusIsland/Resources
  - "**/.build"
  - "**/DerivedData"

# Line length is advisory only — the codebase regularly exceeds it in
# SwiftUI view bodies and string literals. Keep it as a warning, not error.
line_length:
  warning: 140
  error: 240
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

type_body_length:
  warning: 600
  error: 1200

function_body_length:
  warning: 80
  error: 200

file_length:
  warning: 800
  error: 2000

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

# Rules that match the existing style and should stay enabled.
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Rules disabled because they conflict with established patterns in the repo.
disabled_rules:
  - trailing_whitespace
  - todo
  - file_header
  - force_unwrapping # Caveat: kept OFF repo-wide to avoid noise; audited manually.
  - force_cast       # Same rationale; manual review covers the few call sites.
  - notification_center_detachment
  - no_grouping_extension
  - object_literal
  - overridden_super_call
  - weak_delegate # Managers are singletons; delegates are intentionally nil.

# Cyclomatic complexity is frequently exceeded in large SwiftUI switch bodies
# (e.g. ExpandedView routing). Warn only.
cyclomatic_complexity:
  warning: 20
  error: 50

# The codebase uses implicit getters; keep them allowed.
implicit_getter: off

# Allow multiple-closure SwiftUI-style trailing closures.
trailing_closure:
  only_single_muted_parameters: true

reporter: "xcode"
